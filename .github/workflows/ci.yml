name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run full analysis and sanitizer lanes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: pwsh
jobs:
  fast-quality:
    name: Fast Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - name: Initialize required QWindowKit modules
        run: |
          git submodule update --init --recursive third_party/qwindowkit
          if ($LASTEXITCODE -ne 0) { throw 'QWindowKit checkout failed' }
      - name: Install quality tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install clang-format==19.1.7 cmakelang==0.6.13 PyYAML==6.0.3 zizmor==1.30.1
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Repository, C++, CMake and workflow checks
        run: ./tools/quality.ps1 -Mode Fast

  windows-debug:
    name: Windows Debug
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      SCCACHE_DIR: ${{ github.workspace }}/build/sccache-debug
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Restore Qt SDK
        id: qt-cache
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/Qt
          key: qt-windows-x64-msvc2022-6.12.0-quick-v1
      - uses: ./.github/actions/setup-qt # zizmor: ignore[self-repository] -- actionlint 1.7.12 requires the established local-action syntax.
        with:
          cached: ${{ steps.qt-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
      - name: Install formatting tools
        run: |
          python -m pip install clang-format==19.1.7 cmakelang==0.6.13 PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Formatting tool installation failed' }
      - name: Restore build tools
        id: deps-cache
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/tools/perl
          key: deps-windows-x64-msvc2022-${{ hashFiles('third_party/deps.lock.json') }}
      - name: Restore compiler objects
        id: objects-cache
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/sccache-debug
          key: objects-windows-2022-msvc-x64-debug-${{ hashFiles('third_party/deps.lock.json', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: objects-windows-2022-msvc-x64-debug-${{ hashFiles('third_party/deps.lock.json', 'CMakePresets.json') }}-
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.17.0
      - name: Provision pinned build tools
        run: ./tools/dev.ps1 setup
      - name: Build and test
        run: |
          cmake --preset windows-debug -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DREPOSCO_ISOLATED_CLIPBOARD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Private clipboard test configuration failed' }
          ./tools/dev.ps1 test -UseSccache
      - name: QML quality
        run: |
          ./tools/quality.ps1 -Mode FormatCheck -QtRoot $env:QT_ROOT_DIR
          cmake --build --preset windows-debug --target all_qmllint
          if ($LASTEXITCODE -ne 0) { throw 'qmllint failed' }
      - name: Save trusted Qt SDK
        if: github.event_name == 'push' && steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/Qt
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}
      - name: Save trusted build tools
        if: github.event_name == 'push' && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/tools/perl
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - name: Save trusted compiler objects
        if: github.event_name == 'push'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/sccache-debug
          key: ${{ steps.objects-cache.outputs.cache-primary-key }}
      - name: Cache measurements
        if: always()
        env:
          QT_HIT: ${{ steps.qt-cache.outputs.cache-hit }}
          DEPS_HIT: ${{ steps.deps-cache.outputs.cache-hit }}
          OBJECTS_HIT: ${{ steps.objects-cache.outputs.cache-hit }}
        run: |
          "Qt cache=$env:QT_HIT; dependencies=$env:DEPS_HIT; objects=$env:OBJECTS_HIT" >> $env:GITHUB_STEP_SUMMARY
          sccache --show-stats
      - name: Failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-debug-tests
          path: build/windows-debug/Testing
          retention-days: 7

  windows-release:
    name: Windows Release
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      SCCACHE_DIR: ${{ github.workspace }}/build/sccache-release
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Restore Qt SDK
        id: qt-cache
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/Qt
          key: qt-windows-x64-msvc2022-6.12.0-quick-v1
      - uses: ./.github/actions/setup-qt # zizmor: ignore[self-repository] -- actionlint 1.7.12 requires the established local-action syntax.
        with:
          cached: ${{ steps.qt-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
      - name: Restore build tools
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/tools/perl
          key: deps-windows-x64-msvc2022-${{ hashFiles('third_party/deps.lock.json') }}
      - name: Restore compiler objects
        id: objects-cache
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/sccache-release
          key: objects-windows-2022-msvc-x64-release-${{ hashFiles('third_party/deps.lock.json', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: objects-windows-2022-msvc-x64-release-${{ hashFiles('third_party/deps.lock.json', 'CMakePresets.json') }}-
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.17.0
      - name: Build and deploy Release
        run: |
          ./tools/dev.ps1 setup
          $timer = [Diagnostics.Stopwatch]::StartNew()
          ./tools/dev.ps1 build -Configuration Release -UseSccache
          "Release build seconds: $($timer.Elapsed.TotalSeconds)" >> $env:GITHUB_STEP_SUMMARY
          ./tools/package.ps1 -QtRoot $env:QT_ROOT_DIR
      - name: Save trusted compiler objects
        if: github.event_name == 'push'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/sccache-release
          key: ${{ steps.objects-cache.outputs.cache-primary-key }}
      - name: Compiler cache measurements
        if: always()
        run: sccache --show-stats

  portable-core:
    name: Portable Core
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build and test core without Qt
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset portable
          cmake --build --preset portable
          ctest --preset portable

  full-verification:
    name: Full Verification
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - uses: ./.github/actions/setup-qt # zizmor: ignore[self-repository] -- actionlint 1.7.12 requires the established local-action syntax.
      - name: Install analysis tools
        run: ./tools/setup-quality.ps1
      - name: Complete validation
        run: |
          ./tools/dev.ps1 setup
          cmake --preset windows-debug -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DREPOSCO_ISOLATED_CLIPBOARD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Private clipboard test configuration failed' }
          ./tools/dev.ps1 full

  portable-sanitizers:
    name: Portable Sanitizers
    if: github.event_name == 'workflow_dispatch' && inputs.full
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Instrumented core tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset portable-sanitizers
          cmake --build --preset portable-sanitizers
          ctest --preset portable-sanitizers
